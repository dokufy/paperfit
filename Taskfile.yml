version: "3"

env:
  ENV: development
  BASE_PATH: 
    sh: pwd
  SERVER_PORT: '{{ env "SERVER_PORT" | default "4000" }}'

  PDF_GENERATOR_ENDPOINT: '{{ env "PDF_GENERATOR_ENDPOINT" | default "http://localhost:5000/forms/chromium/convert/html" }}'

  CACHE_URL: '{{ env "CACHE_URL" | default "minio://testing?credential=hmac:2V0dOJk8sgV1aGVv6OoU:c2XmdF64zwF5e5JKSU9CJXFujxRI3y3mVHjpI4lJ&endpoint=http:localhost:9000" }}'
  CACHE_ENCRYPTION_KEY: '{{ env "CACHE_ENCRYPTION_KEY" | default "NamGxa5cJVKvd+lXyJtG0UUgsGd7euwHnhDD8SW/1hOAWr6DWeS0w26myN5Thl+U" }}'

dotenv: [".env", "{{.ENV}}/.env.", "{{.HOME}}/.env"]

includes:
  api:
    taskfile: ./schema/Taskfile.yml
    dir: ./schema

tasks:
  install:
    desc: install global (binary) dependencies
    cmds:
      - go install github.com/air-verse/air@latest
      - go install mvdan.cc/gofumpt@latest
      - go install github.com/daixiang0/gci@latest
      - go install golang.org/x/tools/cmd/goimports@latest
      - go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest

  setup:
    desc: run setup (copy .env.dist file, get deps)
    cmds:
      - cp -n .env.dist .env
      - go mod download

  docker:
    desc: run dependency services via Docker
    cmds:
      - docker-compose up
      - defer: docker-compose stop

  gen:
    cmds:
      - task: api:gen

  dev:
    desc: run dev server in watch mode
    cmds:
      - air

  bench:
    desc: runs benchmarks
    vars:
      PATH: '{{ .CLI_ARGS | default "./cmd/bench" }}'
    cmds:
      - go test {{ .PATH }} -bench=. -run=xxx -benchmem

  format:
    desc: runs all code quality tools
    cmds:
      - gofumpt -l -w .
      - gci write --skip-generated -s standard -s default .
      - goimports -w -l .

  lint:
    desc: runs tests
    cmds:
      - golangci-lint run

  test:
    desc: runs tests
    vars:
      PATH: '{{ .CLI_ARGS | default "./..." }}'
    cmds:
      - go test {{ .PATH }}

  test:all:
    desc: runs tests
    cmds:
      - task test:lint
      - task test

  build:
    desc: build server
    cmds:
      - go build -o ./__bin__/ ./cmd/main.go
      - rm -rf ./tmp
