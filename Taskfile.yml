version: "3"

dotenv: ['.env']

env:
  BASE_PATH:
    sh: pwd

includes:
  api:
    taskfile: ./schema/Taskfile.yml
    dir: ./schema

tasks:
  install:
    desc: install all dependencies
    cmds:
      - go install github.com/air-verse/air@latest
      - go install mvdan.cc/gofumpt@latest
      - go install github.com/daixiang0/gci@latest
      - go install golang.org/x/tools/cmd/goimports@latest
      - go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - go mod download
      - task: api:setup
      - '[ -f .env ] || cp .env.dist .env'

  gen:
    desc: generate API code from schema
    cmds:
      - task: api:gen

  docker:
    desc: run dependent services via Docker
    cmds:
      - docker compose up
      - defer: docker compose stop

  dev:
    desc: run dev server in watch mode
    cmds:
      - air

  bench:
    desc: run benchmarks
    vars:
      PATH: '{{ .CLI_ARGS | default "./cmd/bench" }}'
    cmds:
      - go test {{ .PATH }} -bench=. -run=xxx -benchmem

  format:
    desc: format code
    cmds:
      - gofumpt -l -w .
      - gci write --skip-generated -s standard -s default .
      - goimports -w -l .

  lint:
    desc: run linter
    cmds:
      - golangci-lint run

  test:
    desc: run tests
    vars:
      PATH: '{{ .CLI_ARGS | default "./..." }}'
    cmds:
      - go test {{ .PATH }}

  test:all:
    desc: run linter and tests
    cmds:
      - task: lint
      - task: test

  build:
    desc: build server
    cmds:
      - go build -o ./__bin__/ ./cmd/main.go
      - rm -rf ./tmp
