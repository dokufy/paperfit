version: "3"

env:
  ENV: development
  BASE_PATH: 
    sh: pwd
  SERVER_REST_PORT: '{{ env "SERVER_REST_PORT" | default "4000" }}'

  GITLAB_URL: '{{ env "GITLAB_URL" | default "https://gitlab.com" }}'
  GITLAB_TOKEN: '{{ env "GITLAB_TOKEN" | default "glpat-ybJyG6fw6f_gmsUY2QbE" }}'

  PDF_GENERATOR_ENDPOINT: '{{ env "PDF_GENERATOR_ENDPOINT" | default "http://localhost:5000/forms/chromium/convert/html" }}'

  CACHE_URL: '{{ env "CACHE_URL" | default "minio://testing?credential=hmac:0t1nP2rMFBTmz2kbpeOq:yU0JLU4wVrOjDsqCO8E8Mlw1tR0AYUBVtdkuWSZJ&endpoint=http:localhost:9000" }}'
  CACHE_ENCRYPTION_KEY: '{{ env "CACHE_ENCRYPTION_KEY" | default "NamGxa5cJVKvd+lXyJtG0UUgsGd7euwHnhDD8SW/1hOAWr6DWeS0w26myN5Thl+U" }}'

dotenv: [".env", "{{.ENV}}/.env.", "{{.HOME}}/.env"]

tasks:
  install_global:
    desc: install global (binary) dependencies
    cmds:
      - go install github.com/air-verse/air@latest
      - go install mvdan.cc/gofumpt@latest
      - go install github.com/daixiang0/gci@latest
      - go install golang.org/x/tools/cmd/goimports@latest

  setup:
    desc: run setup (copy .env.dist file, get deps)
    cmds:
      - cp -n .env.dist .env
      - go mod download

  docker:
    desc: run dependency services via Docker
    cmds:
      - docker-compose up
      - defer: docker-compose stop

  gen:
    desc: generate code for graphql and database
    cmds:
      - go generate ./...
      - task: format

  format:
    desc: runs all code quality tools
    cmds:
      - gofumpt -l -w .
      - gci write --skip-generated -s standard -s default .
      - goimports -w -l .

  dev:
    desc: run dev server in watch mode
    cmds:
      - air

  bench:
    desc: runs benchmarks
    vars:
      PATH: '{{ .CLI_ARGS | default "./cmd/bench" }}'
    cmds:
      - go test {{ .PATH }} -bench=. -run=xxx -benchmem

  test:
    desc: runs tests
    vars:
      PATH: '{{ .CLI_ARGS | default "./..." }}'
    env:
      CACHE_URL: "minio://testing?credential=hmac:0t1nP2rMFBTmz2kbpeOq:yU0JLU4wVrOjDsqCO8E8Mlw1tR0AYUBVtdkuWSZJ&endpoint=http:localhost:9000"
    cmds:
      - go test -v {{ .PATH }}

  test:all:
    desc: runs tests
    cmds:
      - task test:lint
      - task test

  test:lint:
    desc: runs tests
    cmds:
      - golangci-lint run

  build:
    desc: build server
    cmds:
      - go build -o ./__bin__/ ./cmd/main.go
      - rm -rf ./tmp
